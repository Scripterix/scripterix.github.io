<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Wyniki wyszukiwania w aktualnych stronach Scripterix Studio.">
  <meta name="theme-color" content="#f7f5ef">
  <title>Wyniki wyszukiwania | Scripterix Studio</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/css/site.css" rel="stylesheet">
  <link href="../assets/css/home.css" rel="stylesheet">
</head>
<body data-page="search-result">
  <a class="skip-link" href="#main">Przejdź do treści</a>
  <div class="site-shell" data-agent-root="scripterix-studio">
    <nav class="navbar navbar-expand-lg sticky-top" aria-label="Nawigacja główna" data-agent-section="navigation">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="../index.html"
          aria-label="Scripterix Studio — strona główna"><span class="brand-mark studio-mark"
            aria-hidden="true">s<span>.</span></span><span class="studio-wordmark">Scripterix
            <span>Studio</span></span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
          aria-controls="mainNav" aria-expanded="false" aria-label="Przełącz nawigację"><span
            class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0" data-nav-target></ul>
        </div>
      </div>
    </nav>
    <main id="main">
      <section class="page-hero" data-agent-section="search-results-hero">
        <div class="container">
          <span class="eyebrow"><i class="bi bi-search text-success" aria-hidden="true"></i>Scripterix Studio</span>
          <h1>Wyniki wyszukiwania</h1>
          <p class="lead-copy">Przeszukaj aktualne strony Studio według tematów albo pełniejszego kontekstu treści.</p>
        </div>
      </section>
      <section class="section" data-agent-section="search-results">
        <div class="container">
          <form class="search-form" action="search-result.html" data-search-form>
            <label class="visually-hidden" for="searchQuery">Szukaj</label>
            <div class="search-input-row">
              <input id="searchQuery" name="q" type="search" placeholder="Szukaj w Studio..." autocomplete="off" data-search-query>
              <button class="btn btn-dark" type="submit"><i class="bi bi-search me-2" aria-hidden="true"></i>Szukaj</button>
            </div>
            <div class="search-mode-row" aria-label="Tryb wyszukiwania">
              <label><input type="radio" name="mode" value="topics" data-search-mode checked><span>Tematy</span></label>
              <label><input type="radio" name="mode" value="context" data-search-mode><span>Treść</span></label>
              <strong data-search-count>0 wyników</strong>
            </div>
          </form>
          <div class="search-results-list mt-4" data-search-results></div>
        </div>
      </section>
    </main>
    <footer class="studio-footer" data-agent-section="footer" data-footer-target></footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../src/components/navigation.ts"></script>
  <script type="module" src="../src/components/footer.ts"></script>
</body>
</html>
