<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Wyniki wyszukiwania po indeksie topics i context dla prezentacji Codex v5.5.">
  <title>Wyniki search | Codex v5.5</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/css/site.css" rel="stylesheet">
</head>
<body data-page="search-result">
  <div class="site-shell" data-agent-root="codex-v55-showcase">
    <nav class="navbar navbar-expand-lg sticky-top" data-agent-section="navigation">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="../index.html" aria-label="Codex v5.5">
          <span class="brand-mark"><i class="bi bi-stars" aria-hidden="true"></i></span>
          <span>Codex v5.5</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Przełącz nawigację">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0" data-nav-target></ul>
        </div>
      </div>
    </nav>

    <main>
      <section class="page-hero" data-agent-section="page-hero">
        <div class="container">
          <span class="eyebrow"><i class="bi bi-list-ul text-success" aria-hidden="true"></i>Search / Results</span>
          <h1>Wyniki wyszukiwania</h1>
          <p class="lead-copy">
            Ten widok czyta `data/search-index.json` i pokazuje strony powiązane z tematami albo treścią.
            To baza pod późniejsze podpięcie Fuse.js.
          </p>
        </div>
      </section>

      <section class="section" data-agent-section="search-results">
        <div class="container">
          <form class="search-form" action="search-result.html" data-search-form data-agent-card="search-result-form">
            <label class="visually-hidden" for="searchQuery">Szukaj</label>
            <div class="search-input-row">
              <input id="searchQuery" name="q" type="search" placeholder="name search..." autocomplete="off" data-search-query>
              <button class="btn btn-dark" type="submit">
                <i class="bi bi-search me-2" aria-hidden="true"></i>Szukaj
              </button>
            </div>
            <div class="search-mode-row" aria-label="Tryb wyszukiwania">
              <label>
                <input type="radio" name="mode" value="topics" data-search-mode checked>
                <span>Topics</span>
              </label>
              <label>
                <input type="radio" name="mode" value="context" data-search-mode>
                <span>Context</span>
              </label>
              <strong data-search-count>0 wyników</strong>
            </div>
          </form>

          <div class="search-results-list mt-4" data-search-results></div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <span>Wyniki search</span>
        <span>Źródło: data/search-index.json</span>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../src/components/navigation.ts"></script>
  <script type="module" src="../assets/js/site.js"></script>
</body>
</html>
